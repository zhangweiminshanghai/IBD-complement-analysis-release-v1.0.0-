# Conda environment for the IBD-complement-analysis pipeline.
# R analyses run under r-base 4.5.x; Python is used for docking post-processing.
# After `conda env create -f environment/conda.yml`, also install the R
# packages listed in environment/renv.lock (renv::restore() or the README).
name: ibd-complement-analysis
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.5.3
  - r-essentials
  - r-limma
  - r-wgcna
  - r-glmnet
  - r-randomforest
  - r-ggplot2
  - r-seurat=5.5.0
  - r-twosamplemr
  - r-clusterprofiler
  - r-biocmanager
  - r-dplyr
  - r-patchwork
  - r-cowplot
  - r-doparallel
  - python=3.10
  - numpy
  - pandas
  - matplotlib
  - biopython
  - pip
  - pip:
      - rdkit-pypi
  - autodock-vina   # optional; only needed to regenerate Figure 6 docking poses
